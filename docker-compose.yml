# MCP Crypto Server - Docker Compose
# Services: mcp-server (MCP HTTP), backend (API), webapp (React+nginx), postgres
# Usage: docker compose up -d
# Create .env for POSTGRES_* and other vars (optional)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-mcp_crypto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      TRANSPORT: http
      MCP_HTTP_PORT: "3001"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-mcp_crypto}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-mcp_crypto}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  default:
    name: mcp-crypto-net

volumes:
  postgres_data:
